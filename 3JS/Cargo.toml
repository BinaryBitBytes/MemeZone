[package]
name = "x-maze-client"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = { version = "0.14", features = ["bevy_winit"] }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window"] }

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = 3